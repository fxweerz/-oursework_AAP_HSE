events {}
http {
    server {
        listen 8081;
        location / {
            proxy_pass http://127.0.0.1:8080;
        }
        location /login {
            proxy_pass http://127.0.0.1:8000;
        }
        location /register {
            proxy_pass http://127.0.0.1:8000;
        }
        location /logout {
            proxy_pass http://127.0.0.1:8000;
        }
        location /tasks {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}